<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面談カード配置</title>
<style>
  :root { --bg:#f4f6fb; --panel:#fff; --ink:#1c2430; --muted:#667085; --line:#dfe6ef; --accent:#2a5cc7; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:"Zen Kaku Gothic New","Yu Gothic","Meiryo",sans-serif; }
  body { padding:24px; }
  .page { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  h1 { margin:0 0 8px; font-size:28px; }
  .meta { color:var(--muted); font-size:12px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:#f6f8fc; }
  .bp { font-size:10px; font-weight:700; color:#1d4f9c; }
  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    body { background:#fff; padding:0; }
    .page { border:none; border-radius:0; box-shadow:none; }
    .noprint { display:none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  'use strict';

  const App = window.App = { actions:{}, rp:{ grid:true, list:true, iv:false } };
  const S = {
    title:'面談スケジュール',
    candidates:[
      { id:'c1', name:'候補者A', bp:true },
      { id:'c2', name:'候補者B', bp:false }
    ],
    assignments:[
      { cid:'c1', iid:'i1', slot:'d1_am_0' },
      { cid:'c2', iid:'i2', slot:'d1_am_1' }
    ],
    interviewers:[
      { id:'i1', name:'Quillmere University Press', short:'QUP' },
      { id:'i2', name:'Ostrander & Finch', short:'Ostrander' },
      { id:'i3', name:'Larkspire Publishing', short:'Larkspire' }
    ],
    settings:{
      days:[{ id:'d1', date:'2026-11-06' }, { id:'d2', date:'2026-11-07' }],
      sessions:[{ id:'am', label:'午前', start:'10:00', end:'12:00' }, { id:'pm', label:'午後', start:'14:00', end:'16:00' }],
      slotMin:20,
      gapMin:10,
      perCandidate:1
    }
  };

  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmt(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
  function dayEn(ds){
    if(!ds) return 'Date not set';
    const d = new Date(ds + 'T00:00:00');
    if(isNaN(d)) return ds;
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ', ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate();
  }
  const ordEn = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');

  function reportHtml(){
    const title = (!S.title || S.title === '面談スケジュール') ? 'Interview Schedule' : S.title;
    const cells = [];
    let body = '';

    // Remove the Incomplete / needs fixing note from the header.
    const head = '<header class="page"><h1>' + esc(title) + '</h1><div class="meta"><span class="bp">BP</span> = with Book Proposal</div>';

    // Basic grid section: no footer URL, no incomplete warning.  Browser print headers/footers are outside page HTML and cannot be hidden via CSS in all browsers.
    S.settings.days.forEach(d => {
      const dayLabel = esc(dayEn(d.date));
      body += '<section class="page"><h2>' + dayLabel + '</h2><table><thead><tr><th>Time</th>' + S.interviewers.map(v => '<th>' + esc(v.short || v.name) + '</th>').join('') + '</tr></thead><tbody>';
      S.settings.sessions.forEach(se => {
        const start = Number(String(se.start).split(':')[0]) * 60 + Number(String(se.start).split(':')[1]);
        const end = Number(String(se.end).split(':')[0]) * 60 + Number(String(se.end).split(':')[1]);
        for(let t = start; t + S.settings.slotMin <= end; t += S.settings.slotMin + S.settings.gapMin) {
          const tt = t;
          body += '<tr><th>' + fmt(tt) + ' – ' + fmt(tt + S.settings.slotMin) + '</th>' + S.interviewers.map(v => {
            const match = S.assignments.find(a => a.iid === v.id && a.slot === d.id + '_' + se.id + '_0');
            const c = match ? S.candidates.find(x => x.id === match.cid) : null;
            return '<td>' + (c ? esc(c.name) + (c.bp ? '<span class="bp">BP</span>' : '') : '') + '</td>';
          }).join('') + '</tr>';
        }
      });
      body += '</tbody></table></section>';
    });

    if(!body) body = '<section class="page"><p>No data.</p></section>';

    return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + document.querySelector('style').innerHTML + '</style></head><body>' + head + body + '</body></html>';
  }

  const old = document.getElementById('app');
  if(old){
    old.innerHTML = '<button class="noprint" id="printBtn" style="padding:8px 14px;border:1px solid #2a5cc7;background:#2a5cc7;color:#fff;border-radius:8px;cursor:pointer;margin-bottom:16px;">PDF出力</button>';
    old.querySelector('#printBtn').addEventListener('click', () => {
      const w = window.open('', '_blank');
      w.document.write(reportHtml());
      w.document.close();
      w.focus();
      setTimeout(() => w.print(), 300);
    });
  }
})();
</script>
</body>
</html>
